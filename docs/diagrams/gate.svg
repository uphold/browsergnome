<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img"
     aria-label="browsergnome: the gate on real data — ten LCP captures against nextjs.org, mean 942.4ms, noise band ±30.35ms">
<title>browsergnome: the gate on real data</title>
<!-- ponytail: labels are live &lt;text&gt; (system font stack), not path-outlined like the other
     diagrams — no font-to-path tool was available in this environment. Upgrade to outlined paths
     if the diagram set is ever regenerated through that pipeline again. -->
<rect x="0" y="0" width="960" height="400" rx="14" fill="#0b0e14"/>
<text x="40" y="46" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12"
      letter-spacing="2" fill="#5b6472">THE GATE, ON REAL DATA</text>
<text x="40" y="74" font-family="Instrument Sans, -apple-system, sans-serif" font-size="22"
      font-weight="700" fill="#e6eaf2">Ten real LCP captures, one noise band</text>
<text x="40" y="98" font-family="Instrument Sans, -apple-system, sans-serif" font-size="14"
      fill="#9aa4b8">nextjs.org, unchanged · N=10 · throttled (Slow 4G, 4x CPU) · this run is where</text>
<text x="40" y="118" font-family="Instrument Sans, -apple-system, sans-serif" font-size="14"
      fill="#9aa4b8"><tspan fill="#e6eaf2" font-family="JetBrains Mono, ui-monospace, monospace">minEffect: 30ms · k: 2</tspan> for <tspan fill="#e6eaf2">first-load</tspan> came from</text>

<!-- plot area: x 80..900, y 150..340 ; ms axis 895..980 (zoomed), y = 340 - (ms-900)*2.4 -->
<line x1="80" y1="150" x2="80" y2="340" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
<line x1="80" y1="340" x2="900" y2="340" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

<g font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#5b6472">
<line x1="80" y1="340" x2="900" y2="340" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="66" y="344" text-anchor="end">900</text>
<line x1="80" y1="280" x2="900" y2="280" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="66" y="284" text-anchor="end">925</text>
<line x1="80" y1="220" x2="900" y2="220" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="66" y="224" text-anchor="end">950</text>
<line x1="80" y1="160" x2="900" y2="160" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<text x="66" y="164" text-anchor="end">975</text>
<text x="30" y="248" fill="#5b6472" transform="rotate(-90 30 248)" text-anchor="middle">ms</text>
</g>

<!-- noise band: mean 942.44 ± 30.35 -->
<rect x="80" y="165.32" width="820" height="145.68" fill="#E45FD8" opacity="0.10"/>
<line x1="80" y1="165.32" x2="900" y2="165.32" stroke="#E45FD8" stroke-width="1.5" stroke-dasharray="5,4"/>
<line x1="80" y1="311.00" x2="900" y2="311.00" stroke="#E45FD8" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="906" y="169" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#E45FD8">+30.35</text>
<text x="906" y="315" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#E45FD8">−30.35</text>

<!-- mean line -->
<line x1="80" y1="238.16" x2="900" y2="238.16" stroke="#9aa4b8" stroke-width="1.5" stroke-dasharray="2,4"/>
<text x="906" y="242" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#9aa4b8">942.4</text>

<!-- the 10 real samples, in capture order -->
<g fill="#e6eaf2">
<circle cx="100" cy="258.86" r="5"/>  <!-- 1: 933.807 -->
<circle cx="178" cy="203.31" r="5"/>  <!-- 2: 956.956 -->
<circle cx="256" cy="231.99" r="5"/>  <!-- 3: 945.004 -->
<circle cx="334" cy="251.62" r="5"/>  <!-- 4: 936.825 -->
<circle cx="412" cy="220.81" r="5"/>  <!-- 5: 949.663 -->
<circle cx="490" cy="242.94" r="5"/>  <!-- 6: 940.443 -->
<circle cx="568" cy="250.20" r="5"/>  <!-- 7: 937.415 -->
<circle cx="646" cy="306.78" r="5"/>  <!-- 8: 913.840 -->
<circle cx="724" cy="238.54" r="5"/>  <!-- 9: 942.273 -->
<circle cx="802" cy="176.50" r="5"/>  <!-- 10: 968.126 -->
</g>
<text x="490" y="366" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace"
      font-size="11" fill="#5b6472">capture order, 1 → 10</text>

<text x="40" y="390" font-family="Instrument Sans, -apple-system, sans-serif" font-size="12.5"
      fill="#5b6472">Every point here is the same unchanged page — the band is the noise a real fix has to clear, not a guess.</text>
</svg>
