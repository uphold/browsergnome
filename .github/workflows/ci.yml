# CI covers only the offline chain:
#   - all self-tests (stats / playbook / doctor / trace / bundle / lcp-attribution / page-tools / invariants)
#   - offline smoke chain: lcp_attribution → build_lcp_map, build_run_report from the sample fixture,
#     build_perf_map --renders from the render-overlay fixture pair
#   - JSON validation of all plugin manifests
#   - official plugin manifest validation (claude plugin validate --strict)
#   - every `Guidance:` id resolves at the pinned modern-web-guidance (the one networked step:
#     it downloads the pinned package once)
#
# The live path (chrome-devtools-mcp / real browser / MCP runtime) cannot be CI-tested
# because it requires a running Chrome instance and an active Claude Code session.

name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Read-only token: the guidance step runs a third-party npm package, and checkout persists the token.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: All self-tests
        run: npm test

      - name: Offline smoke chain — lcp_attribution
        run: node skills/browsergnome/scripts/lcp_attribution.mjs skills/browsergnome/assets/trace.render-blocking-sample.json.gz > /tmp/attribution.json

      - name: Offline smoke chain — build_lcp_map
        run: node skills/browsergnome/scripts/build_lcp_map.mjs /tmp/attribution.json --out /tmp/lcp-map.html

      - name: Offline smoke chain — build_run_report
        run: node skills/browsergnome/scripts/build_run_report.mjs skills/browsergnome/assets/run-state.sample.json --out /tmp/report.html

      - name: Offline smoke chain — build_perf_map render overlay
        run: node skills/browsergnome/scripts/build_perf_map.mjs skills/browsergnome/assets/graph.renders-sample.json --renders skills/browsergnome/assets/render-profile.sample.json --out /tmp/perf-map.html

      # Assert each output file exists and is non-empty.
      - name: Assert smoke-chain outputs are non-empty
        run: |
          test -s /tmp/attribution.json || (echo "attribution.json is missing or empty" && exit 1)
          test -s /tmp/lcp-map.html     || (echo "lcp-map.html is missing or empty"      && exit 1)
          test -s /tmp/report.html      || (echo "report.html is missing or empty"       && exit 1)
          test -s /tmp/perf-map.html    || (echo "perf-map.html is missing or empty"     && exit 1)
          grep -q '"renders":3' /tmp/perf-map.html || (echo "perf-map.html is missing the render overlay" && exit 1)

      - name: Guidance ids resolve at the pinned modern-web-guidance
        if: matrix.node-version == '22.x'
        env:
          DISABLE_TELEMETRY: 1
        run: |
          pin=$(grep -oE 'Pinned: `modern-web-guidance@[0-9]+\.[0-9]+\.[0-9]+' skills/browsergnome/references/tools.md | cut -d@ -f2)
          test -n "$pin" || { echo "::error::no modern-web-guidance pin in references/tools.md"; exit 1; }
          ids=$( { grep -rh '^Guidance:' skills/browsergnome/references/knowledge | sed 's/^Guidance:[[:space:]]*//'
                   grep -oE '"guidance"[[:space:]]*:[[:space:]]*"[^"]*"' skills/browsergnome/assets/playbook.seed.json | cut -d'"' -f4; } | sort -u)
          test -n "$ids" || { echo "::error::found no Guidance ids to check"; exit 1; }
          fail=0
          while IFS= read -r id; do
            if ! printf '%s' "$id" | grep -qE '^[a-z0-9-]+$'; then echo "::error::Guidance '$id' is not a bare modern-web-guidance id"; fail=1
            elif npx --yes "modern-web-guidance@$pin" retrieve "$id" > /dev/null 2>&1; then echo "  ok  $id"
            else echo "::error::Guidance id '$id' does not resolve at modern-web-guidance@$pin"; fail=1; fi
          done <<< "$ids"
          exit $fail

      - name: Validate JSON files
        run: |
          node -e "
            const fs = require('fs');
            const files = [
              '.claude-plugin/plugin.json',
              '.claude-plugin/marketplace.json',
              '.mcp.json',
              'package.json',
              'skills/browsergnome/assets/run-state.sample.json',
              'skills/browsergnome/assets/graph.renders-sample.json',
              'skills/browsergnome/assets/render-profile.sample.json',
            ];
            let ok = true;
            for (const f of files) {
              try {
                JSON.parse(fs.readFileSync(f, 'utf8'));
                console.log('  ok  ' + f);
              } catch (e) {
                console.error('FAIL  ' + f + ': ' + e.message);
                ok = false;
              }
            }
            if (!ok) process.exit(1);
          "

      # Static manifest validation via the official Claude Code CLI.
      # No auth needed — `plugin validate` is offline. --strict treats
      # warnings (e.g. a missing marketplace description) as errors.
      - name: Official plugin validation (strict)
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.226
          claude plugin validate . --strict
